version: 1
# Native isolation: qualified Codex releases on Linux. Run swarm doctor before work.
default_agent: codex
default_gate: agent
plan_mode: auto
execution:
  mode: isolated
  backend: native
lease:
  duration: 4h
  renewable: true
  max_renewals: 3
security:
  require_isolation: true
  require_ready_label: true
  ready_label: "swarm:ready"
agents:
  codex:
    binary: codex
